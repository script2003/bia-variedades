<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlock — Vídeo Promocional</title>
<style>
  @font-face { font-family: Anton; src: url(assets/fonts/anton.woff2) format("woff2"); }
  @font-face { font-family: JBM; font-weight: 400; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: JBM; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }

  :root { --bg: #05050b; --purple: #8b5cf6; --purple-hi: #c4b5fd; --white: #f5f3ff; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); transform-origin: 0 0; }
  canvas { position: absolute; left: 0; top: 0; }
  #view { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 540px 960px; }
  #world { position: absolute; left: 540px; top: 960px; width: 0; height: 0; transform-style: preserve-3d; }

  .card { position: absolute; left: 0; top: 0; width: 900px; height: 506px; margin: -253px 0 0 -450px; transform-style: preserve-3d; }
  .card .frame { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; }
  .card img { width: 100%; height: 100%; display: block; }
  .card .sheen { position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.16) 48%, rgba(196,181,253,.10) 52%, transparent 62%);
    background-size: 300% 100%; }
  .card .cap { position: absolute; left: 4px; top: 534px; white-space: nowrap; font: 700 26px JBM; letter-spacing: .16em; color: var(--purple-hi); }

  #panel { position: absolute; left: 0; top: 0; width: 900px; height: 832px; margin: -416px 0 0 -450px; transform-style: preserve-3d; }
  #panel .frame { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; }
  #panel img { width: 100%; height: 100%; display: block; }
  #panel svg { position: absolute; inset: 0; overflow: visible; }

  #icon { position: absolute; left: 540px; top: 0; width: 220px; height: 220px; margin-left: -110px; border-radius: 52px; overflow: hidden; }
  #icon img { width: 100%; height: 100%; display: block; }

  .txt { position: absolute; left: 70px; right: 70px; text-align: center; color: var(--white); }
  #tag { font: 700 26px JBM; letter-spacing: .32em; color: var(--purple-hi); }
  #head { font-family: Anton, Impact, sans-serif; line-height: .98; text-transform: uppercase; }
  #head .line { white-space: nowrap; }
  #sub { font: 600 40px Inter, system-ui, sans-serif; color: #d9d6ea; }
  #brand { font-family: Anton, Impact, sans-serif; font-size: 128px; line-height: 1; }
  #cta { font: 700 28px JBM; letter-spacing: .3em; color: var(--purple-hi); }
  .w { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }

  .notext .txt, .notext .cap { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbBlur" stdDeviation="0 0"/></filter>
</svg>

<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="view">
    <div id="world">
      <div class="card" id="c0"><div class="frame"><img src="assets/produto-120-144fps.jpg" alt=""><div class="sheen"></div></div><div class="cap"></div></div>
      <div class="card" id="c1"><div class="frame"><img src="assets/produto-ss-keymouse-pro.jpg" alt=""><div class="sheen"></div></div><div class="cap"></div></div>
      <div class="card" id="c2"><div class="frame"><img src="assets/produto-otimizacao-extrema.jpg" alt=""><div class="sheen"></div></div><div class="cap"></div></div>
      <div id="panel">
        <div class="frame"><img src="assets/discord-painel.png" alt=""></div>
        <!-- Destaques desenhados sobre a captura (coordenadas da captura 720×666, escala 1,25) -->
        <svg viewBox="0 0 720 666" preserveAspectRatio="none">
          <rect id="hl1" x="16" y="178" width="306" height="78" rx="16" fill="none" stroke="#a78bfa" stroke-width="3.5"/>
          <rect id="hl2" x="16" y="262" width="374" height="46" rx="14" fill="none" stroke="#a78bfa" stroke-width="3"/>
        </svg>
      </div>
    </div>
  </div>
  <div id="icon"><img src="assets/unlock-icone.png" alt=""></div>
  <canvas id="fx2" width="1080" height="1920"></canvas>

  <div class="txt" id="tag"></div>
  <div class="txt" id="head"></div>
  <div class="txt" id="sub"></div>
  <div class="txt" id="brand"></div>
  <div class="txt" id="cta"></div>

  <canvas id="fx" width="1080" height="1920"></canvas>
</div>

<script src="textos.js"></script>
<script>
(() => {
"use strict";
const DUR = 20, W = 1080, H = 1920, BEAT = 0.5;
const params = new URLSearchParams(location.search);
const NO_TEXT = params.has("semtexto");
if (NO_TEXT) document.getElementById("stage").classList.add("notext");
const T = window.TEXTOS;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  linear: x => x,
  inSine: x => 1 - Math.cos(x * Math.PI / 2),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutQuart: x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
// keyframe track: [[t, v], [t, v, easing], ...] — easing applies to the segment ending at that key
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) {
      const [t0, v0] = keys[i - 1];
      return lerp(v0, v1, E[e || "inOutSine"](prog(t, t0, t1)));
    }
  }
  return keys[keys.length - 1][1];
}
// deterministic pseudo-random
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// beat pulse 1 → 0 after each beat, only while the groove is playing
function pulse(t) {
  const groove = (t >= 3 && t < 15) || (t >= 16 && t < 18);
  if (!groove) return 0;
  return Math.exp(-((t % BEAT) / BEAT) * 6);
}

const $ = id => document.getElementById(id);
const bg = $("bg").getContext("2d"), fx = $("fx").getContext("2d"), fx2 = $("fx2").getContext("2d");
const cards = [$("c0"), $("c1"), $("c2")];
const world = $("world"), view = $("view"), panel = $("panel"), icon = $("icon");
const tag = $("tag"), head = $("head"), sub = $("sub"), brand = $("brand"), cta = $("cta");
const hl1 = $("hl1"), hl2 = $("hl2"), mbBlur = $("mbBlur");

// ---------- text building ----------
function build(el, text, fontPx, maxW) {
  const key = text + "|" + fontPx;
  if (el._key === key) return;
  el._key = key;
  el.innerHTML = "";
  if (!text) return;
  el.style.fontSize = fontPx + "px";
  for (const line of text.split("\n")) {
    const d = document.createElement("div");
    d.className = "line";
    line.split(/(\s+)/).forEach(part => {
      if (!part) return;
      const s = document.createElement("span");
      s.className = "w";
      s.textContent = part;
      d.appendChild(s);
    });
    el.appendChild(d);
  }
  // shrink to fit the safe width
  let widest = 0;
  for (const d of el.children) {
    let w = 0; for (const s of d.children) w += s.getBoundingClientRect().width;
    widest = Math.max(widest, w);
  }
  if (widest > maxW) el.style.fontSize = Math.floor(fontPx * maxW / widest) + "px";
}
// animate words in (tin) and out (tout)
function animWords(el, t, tin, tout, o = {}) {
  const stagger = o.stagger ?? 0.06, dur = o.dur ?? 0.55, outDur = o.outDur ?? 0.3;
  const fromScale = o.fromScale ?? 1.35, dy = o.dy ?? 70, blur = o.blur ?? 18;
  const ws = el.querySelectorAll(".w");
  let any = false;
  ws.forEach((w, i) => {
    const p = E.outExpo(prog(t, tin + i * stagger, tin + i * stagger + dur));
    const q = E.inCubic(prog(t, tout, tout + outDur));
    const op = p * (1 - q);
    if (op > 0.001) any = true;
    const sc = lerp(fromScale, 1, p) * lerp(1, 0.92, q);
    const y = (1 - p) * dy - q * 40;
    const b = (1 - p) * blur + q * 14;
    w.style.opacity = op.toFixed(3);
    w.style.transform = `translateY(${y.toFixed(1)}px) scale(${sc.toFixed(4)})`;
    w.style.filter = b > 0.2 ? `blur(${b.toFixed(1)}px)` : "none";
  });
  el.style.visibility = any ? "visible" : "hidden";
}
function place(el, top) { el.style.top = top + "px"; }

// ---------- 3D wireframe (icosahedron) ----------
const PHI = (1 + Math.sqrt(5)) / 2;
const IV = [[-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0], [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI], [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]]
  .map(v => { const l = Math.hypot(...v); return v.map(c => c / l); });
const IE = [];
for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
  const d = Math.hypot(IV[i][0] - IV[j][0], IV[i][1] - IV[j][1], IV[i][2] - IV[j][2]);
  if (d < 1.1) IE.push([i, j]);
}
function drawWire(ctx, cx, cy, r, ax, ay, alpha, drawK = 1, lw = 3) {
  if (alpha <= 0 || r <= 0) return;
  const P = IV.map(([x, y, z]) => {
    let x1 = x * Math.cos(ay) + z * Math.sin(ay), z1 = -x * Math.sin(ay) + z * Math.cos(ay);
    let y1 = y * Math.cos(ax) - z1 * Math.sin(ax), z2 = y * Math.sin(ax) + z1 * Math.cos(ax);
    const s = 3.2 / (3.2 - z2);
    return [cx + x1 * r * s, cy + y1 * r * s, z2];
  });
  ctx.save();
  ctx.lineCap = "round";
  ctx.shadowColor = "rgba(139,92,246,.9)";
  ctx.shadowBlur = 24;
  IE.forEach(([a, b], i) => {
    const k = clamp(drawK * IE.length - i * 0.55, 0, 1);
    if (k <= 0) return;
    const pa = P[a], pb = P[b];
    const depth = (pa[2] + pb[2]) / 2;
    ctx.strokeStyle = `rgba(${depth > 0 ? "221,214,254" : "139,92,246"},${(alpha * (0.45 + 0.55 * (depth + 1) / 2)).toFixed(3)})`;
    ctx.lineWidth = lw * (0.7 + 0.5 * (depth + 1) / 2);
    ctx.beginPath();
    ctx.moveTo(pa[0], pa[1]);
    ctx.lineTo(lerp(pa[0], pb[0], k), lerp(pa[1], pb[1], k));
    ctx.stroke();
  });
  ctx.restore();
}

// ---------- particles ----------
const PARTS = (() => { const r = rng(7); return Array.from({ length: 46 }, () => ({ x: r() * W, y: r() * H, sp: 30 + r() * 70, sz: 1 + r() * 2.6, ph: r() * 6.28, hue: r() < .7 })); })();
function drawParticles(ctx, t, amount) {
  if (amount <= 0) return;
  ctx.save();
  for (const p of PARTS) {
    const y = ((p.y - p.sp * t) % H + H) % H;
    const x = p.x + Math.sin(t * 0.8 + p.ph) * 18;
    const a = amount * (0.35 + 0.35 * Math.sin(t * 2 + p.ph));
    if (a <= 0.02) continue;
    ctx.fillStyle = p.hue ? `rgba(167,139,250,${a.toFixed(3)})` : `rgba(255,255,255,${(a * .8).toFixed(3)})`;
    ctx.shadowColor = "rgba(139,92,246,.8)"; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(x, y, p.sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---------- grain ----------
const GRAIN = Array.from({ length: 6 }, (_, k) => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), d = g.createImageData(256, 256), r = rng(100 + k);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
});

// ---------- background ----------
function drawBg(t, s) {
  const ctx = bg;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#05050b"; ctx.fillRect(0, 0, W, H);
  // soft navy glow
  let g = ctx.createRadialGradient(540, 900, 50, 540, 960, 1300);
  g.addColorStop(0, "rgba(22,20,52,1)"); g.addColorStop(1, "rgba(5,5,11,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const pl = pulse(t);
  // purple halo (scene dependent)
  let halo = 0, haloY = 960;
  if (s === 2) halo = 0.18 + 0.08 * pl;
  if (s === 3) halo = 0.42 + 0.12 * pl;
  if (s === 4) { halo = 0.26 + 0.08 * pl; haloY = 1080; }
  if (s === 5) halo = (t < 18 ? 0.3 : 0.38) + 0.12 * pl;
  if (halo > 0) {
    g = ctx.createRadialGradient(540, haloY, 20, 540, haloY, 820);
    g.addColorStop(0, `rgba(139,92,246,${halo})`); g.addColorStop(0.45, `rgba(91,33,182,${halo * .45})`); g.addColorStop(1, "rgba(20,10,40,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // fine grid lines, very faint
  ctx.strokeStyle = "rgba(167,139,250,0.045)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 60; x < W; x += 120) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y < H; y += 120) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();

  if (s === 1) drawScene1Bg(ctx, t);
  if (s === 3) drawGeoLines(ctx, t, 960, prog(t, 7.0, 7.8) * (1 - prog(t, 10.6, 11)));
  if (s === 4) drawGeoLines(ctx, t, 1080, 0.55 * prog(t, 11.2, 12));
  if (s === 5) drawGeoLines(ctx, t, t < 18 ? 960 : 860, 0.6 * prog(t, 15.2, 16) * (1 - prog(t, 19.2, 19.8)));
  drawParticles(ctx, t, s === 3 ? 1 : s === 4 ? .55 : s === 5 ? .7 : s === 2 ? .3 : prog(t, 1.6, 2.4) * .3);

  // vignette
  g = ctx.createRadialGradient(540, 960, 600, 540, 960, 1250);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.72)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawGeoLines(ctx, t, cy, a) {
  if (a <= 0) return;
  ctx.save();
  ctx.translate(540, cy);
  ctx.lineWidth = 2;
  // two counter-rotating squares
  [[600, 0.08, .22], [700, -0.06, .14]].forEach(([r, sp, al], i) => {
    ctx.save(); ctx.rotate(Math.PI / 4 + t * sp + i);
    ctx.strokeStyle = `rgba(167,139,250,${al * a})`;
    ctx.strokeRect(-r, -r, r * 2, r * 2); ctx.restore();
  });
  // dashed orbit
  ctx.setLineDash([4, 18]); ctx.lineDashOffset = -t * 40;
  ctx.strokeStyle = `rgba(221,214,254,${.28 * a})`;
  ctx.beginPath(); ctx.arc(0, 0, 640, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  // orbiting light
  const ang = t * 0.9;
  ctx.fillStyle = `rgba(221,214,254,${.9 * a})`; ctx.shadowColor = "#8b5cf6"; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(Math.cos(ang) * 640, Math.sin(ang) * 640, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawScene1Bg(ctx, t) {
  // light line sweeping across, then collapsing to the centre
  const a1 = prog(t, 0.15, 0.75);
  if (a1 > 0 && t < 0.95) {
    const head = lerp(-150, 1230, E.inOutCubic(a1));
    const collapse = E.inCubic(prog(t, 0.62, 0.9));
    const tailLen = 700 * (1 - collapse);
    const x0 = lerp(Math.max(0, head - tailLen), 540, collapse), x1 = lerp(Math.min(W, head), 540, collapse);
    ctx.save();
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, "rgba(139,92,246,0)"); g.addColorStop(.8, "rgba(167,139,250,.95)"); g.addColorStop(1, "rgba(255,255,255,1)");
    ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.shadowColor = "#8b5cf6"; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.moveTo(x0, 960); ctx.lineTo(Math.max(x0 + 1, x1), 960); ctx.stroke();
    ctx.restore();
  }
  // icosahedron forms from the point, spins fast, flies through the camera
  const form = prog(t, 0.78, 1.32), fly = prog(t, 1.3, 1.52);
  if (t >= 0.78 && t < 1.55) {
    const r = 260 * E.outBack(form) + 1500 * E.inExpo(fly);
    const spin = t * 2.2 + E.inCubic(prog(t, 0.9, 1.52)) * 7;
    drawWire(ctx, 540, 960, r, spin * 0.6, spin, 1 - fly * 0.85, form, 3.2);
  }
  // large slow wireframe behind the title
  const back = prog(t, 1.45, 2.0) * (1 - prog(t, 2.7, 3.0));
  if (back > 0) drawWire(ctx, 540, 960, 620, t * 0.25 + 0.4, t * 0.35, 0.22 * back, 1, 2);
}

// ---------- geometric mask transitions ----------
function poly(ctx, n, r, rot) {
  for (let i = 0; i < n; i++) {
    const a = rot + i * Math.PI * 2 / n;
    const x = 540 + Math.cos(a) * r, y = 960 + Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
const TRANS = [{ at: 3.0, n: 4, R: 1700 }, { at: 11.0, n: 6, R: 1450 }, { at: 15.0, n: 3, R: 2500 }];
function drawTransitions(t) {
  for (const tr of TRANS) {
    const a = prog(t, tr.at - 0.3, tr.at), b = prog(t, tr.at, tr.at + 0.38);
    if (t < tr.at - 0.3 || t > tr.at + 0.38) continue;
    const ctx = fx;
    const rot0 = -Math.PI / 2 + (t - tr.at) * 2.2;
    ctx.save();
    if (t < tr.at) {
      const r = tr.R * E.inCubic(a);
      ctx.beginPath(); poly(ctx, tr.n, r, rot0);
      ctx.fillStyle = "#05050b"; ctx.fill();
      ctx.shadowColor = "#8b5cf6"; ctx.shadowBlur = 30; ctx.strokeStyle = "rgba(196,181,253,.95)"; ctx.lineWidth = 5; ctx.stroke();
    } else {
      const r = tr.R * E.outCubic(b);
      ctx.beginPath(); ctx.rect(0, 0, W, H); poly(ctx, tr.n, r, rot0);
      ctx.fillStyle = "#05050b"; ctx.fill("evenodd");
      ctx.beginPath(); poly(ctx, tr.n, r, rot0);
      ctx.shadowColor = "#8b5cf6"; ctx.shadowBlur = 30; ctx.strokeStyle = `rgba(196,181,253,${.95 * (1 - b)})`; ctx.lineWidth = 5; ctx.stroke();
    }
    ctx.restore();
  }
}

// ---------- camera ----------
function camera(t) {
  if (t < 7.0 - 0.25) {
    return {
      cx: 0,
      cy: track([[3.0, -620], [3.7, -620], [4.0, 0, "inOutQuart"], [4.7, 0], [5.0, 620, "inOutQuart"], [5.7, 620], [6.0, 0, "inOutCubic"]], t),
      cz: track([[3.0, -1700], [3.5, 110, "outExpo"], [3.7, 170], [3.85, 0], [4.0, 110, "outCubic"], [4.7, 190], [4.85, 0], [5.0, 110, "outCubic"], [5.7, 190], [6.0, -1450, "inOutCubic"], [6.75, -1550, "linear"]], t),
      rx: track([[5.7, 0], [6.0, 9, "inOutCubic"], [6.75, 11, "linear"]], t),
      ry: track([[3.0, 26], [3.5, 0, "outExpo"], [5.7, 0], [6.0, -20, "inOutCubic"], [6.75, -26, "linear"]], t),
    };
  }
  if (t < 11) {
    return {
      cx: track([[9.0, 0], [9.5, -215, "inOutCubic"], [10.45, -190, "linear"], [10.8, 0, "inOutCubic"]], t),
      cy: track([[9.0, 0], [9.5, -110, "inOutCubic"], [10.45, 50, "inOutSine"], [10.8, 0, "inOutCubic"]], t),
      cz: track([[6.75, -1550], [7.35, 150, "outExpo"], [9.0, 250, "inOutSine"], [9.5, 840, "inOutCubic"], [10.45, 900, "linear"], [10.8, 250, "inOutCubic"], [11, 280]], t),
      rx: track([[6.75, 11], [7.35, 0, "outExpo"], [9.0, 2, "inOutSine"], [9.5, 0], [10.8, 0]], t),
      ry: track([[6.75, -26], [7.35, 0, "outExpo"], [9.0, -5, "inOutSine"], [9.5, 0], [10.45, 3], [10.8, 0]], t),
    };
  }
  if (t < 15) return { cx: 0, cy: 0, cz: 0, rx: 0, ry: 0 };
  return {
    cx: 0, cy: 0,
    cz: track([[15.0, -1100], [15.6, -430, "outExpo"], [18.0, -330, "linear"], [18.45, -1300, "inCubic"]], t),
    rx: track([[15.0, 14], [15.6, 3, "outExpo"], [18.0, 0, "linear"]], t),
    ry: track([[15.0, -18], [15.6, 6, "outExpo"], [18.0, -6, "linear"]], t),
  };
}
const projScale = cz => 1800 / Math.max(200, 1800 - cz);

// ---------- main render ----------
function sceneOf(t) { return t < 3 ? 1 : t < 7 ? 2 : t < 11 ? 3 : t < 15 ? 4 : 5; }

function renderAt(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const s = sceneOf(t);
  const pl = pulse(t);

  drawBg(t, s);
  fx.clearRect(0, 0, W, H);
  fx2.clearRect(0, 0, W, H);

  // ----- camera + world -----
  const c = camera(t), cp = camera(Math.max(0, t - 1 / 30));
  const sc = projScale(c.cz);
  world.style.transform = `translateZ(${c.cz.toFixed(2)}px) rotateX(${c.rx.toFixed(3)}deg) rotateY(${c.ry.toFixed(3)}deg) translate3d(${(-c.cx).toFixed(2)}px, ${(-c.cy).toFixed(2)}px, 0)`;
  // directional motion blur from camera speed (skipped across scene cuts)
  let bx = 0, by = 0;
  if (sceneOf(Math.max(0, t - 1 / 30)) === s || (s === 3 && t < 7.4)) {
    by = Math.abs(c.cy - cp.cy) * sc * 0.22;
    bx = Math.abs(c.cx - cp.cx) * sc * 0.22;
    const bz = Math.abs(projScale(c.cz) - projScale(cp.cz)) * 40;
    bx = Math.min(22, bx + bz); by = Math.min(22, by + bz);
  }
  if (bx + by > 0.6) { mbBlur.setAttribute("stdDeviation", `${bx.toFixed(1)} ${by.toFixed(1)}`); view.style.filter = "url(#mb)"; }
  else view.style.filter = "none";

  // ----- cards -----
  const glow = 50 + 40 * pl;
  cards.forEach((el, i) => {
    let x = 0, y = 0, z = 0, ry = 0, op = 0, scl = 1;
    if (s === 2) {
      y = (i - 1) * 620;
      op = E.outCubic(prog(t, 3.0 + i * 0.12, 3.45 + i * 0.12));
      ry = Math.sin(t * 1.3 + i) * 2.5;
    } else if (s === 3) {
      if (i === 1) { op = 1; }
      else {
        const k = E.inCubic(prog(t, 6.9, 7.4));
        y = (i - 1) * 620; x = (i - 1) * 1600 * k; z = -500 * k; ry = (i - 1) * 40 * k; op = 1 - k;
      }
    } else if (s === 5 && i === 1) {
      y = 30;
      op = E.outCubic(prog(t, 15.15, 15.6)) * (1 - prog(t, 18.0, 18.3));
    }
    el.style.display = op > 0.001 ? "block" : "none";
    if (op <= 0.001) return;
    el.style.opacity = op.toFixed(3);
    el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${ry.toFixed(3)}deg) scale(${scl})`;
    const g = s === 3 ? glow * 1.4 : glow;
    el.querySelector(".frame").style.boxShadow =
      `0 0 0 2px rgba(196,181,253,${(.45 + .3 * pl).toFixed(2)}), 0 0 ${g.toFixed(0)}px rgba(139,92,246,.55), 0 0 ${(g * 2.2).toFixed(0)}px rgba(109,40,217,.25), 0 60px 110px rgba(0,0,0,.75)`;
    // caption
    const cap = el.querySelector(".cap");
    if (s === 2) {
      cap.textContent = T.produtos.legendas[i] || "";
      const k = E.outExpo(prog(t, 3.25 + i * 1.0, 3.75 + i * 1.0));
      cap.style.opacity = k.toFixed(3);
      cap.style.transform = `translateX(${((1 - k) * -40).toFixed(1)}px)`;
    } else cap.style.opacity = 0;
    // sheen sweep over the hero card
    const sh = el.querySelector(".sheen");
    const sk = i === 1 ? prog(t, 7.6, 8.5) : 0;
    sh.style.opacity = sk > 0 && sk < 1 ? Math.sin(sk * Math.PI).toFixed(3) : 0;
    sh.style.backgroundPosition = `${(100 - sk * 100).toFixed(1)}% 0`;
  });

  // ----- discord panel -----
  if (s === 4) {
    const k = E.outExpo(prog(t, 11.0, 11.75));
    const drift = prog(t, 11.75, 15);
    const pry = lerp(-30, -9, k) + 13 * drift, prx = lerp(14, 6, k) - 4 * drift;
    const pz = lerp(-700, 0, k) + 110 * E.inOutSine(drift);
    panel.style.display = "block";
    panel.style.transform = `translate3d(0, 130px, ${pz.toFixed(1)}px) rotateY(${pry.toFixed(3)}deg) rotateX(${prx.toFixed(3)}deg)`;
    panel.querySelector(".frame").style.boxShadow =
      `0 0 0 2px rgba(196,181,253,${(.4 + .3 * pl).toFixed(2)}), 0 0 ${glow.toFixed(0)}px rgba(139,92,246,.55), 0 0 ${(glow * 2.2).toFixed(0)}px rgba(109,40,217,.25), 0 60px 120px rgba(0,0,0,.8)`;
    const drawRect = (r, a, b) => {
      const len = 2 * (+r.getAttribute("width") + +r.getAttribute("height"));
      const p = E.inOutCubic(prog(t, a, b));
      r.style.strokeDasharray = `${len}`;
      r.style.strokeDashoffset = `${(len * (1 - p)).toFixed(1)}`;
      r.style.opacity = p > 0 ? (0.75 + 0.25 * pl).toFixed(2) : 0;
      r.style.filter = "drop-shadow(0 0 8px rgba(139,92,246,.9))";
    };
    drawRect(hl1, 12.0, 12.45);
    drawRect(hl2, 12.5, 12.9);
  } else panel.style.display = "none";

  // ----- brand icon -----
  if (s === 5) {
    const k = E.outBack(prog(t, 15.25, 15.75));
    const f = E.inOutCubic(prog(t, 18.0, 18.6));
    const size = lerp(1, 1.45, f) * lerp(0.6, 1, k);
    const top = lerp(470, 640, f);
    icon.style.display = "block";
    icon.style.top = top + "px";
    icon.style.opacity = (prog(t, 15.25, 15.5) * (1 - E.inCubic(prog(t, 19.25, 19.9)))).toFixed(3);
    icon.style.transform = `scale(${size.toFixed(4)})`;
    icon.style.filter = k < 1 ? `blur(${((1 - prog(t, 15.25, 15.6)) * 12).toFixed(1)}px)` : "none";
    icon.style.boxShadow = `0 0 0 3px rgba(196,181,253,${(.5 + .4 * pl).toFixed(2)}), 0 0 ${(60 + 50 * pl).toFixed(0)}px rgba(139,92,246,.7)`;
    // ring burst on the impact (16.0) and brand hit (18.0)
    [16.0, 18.0].forEach(hit => {
      const r = prog(t, hit, hit + 0.7);
      if (r <= 0 || r >= 1) return;
      fx2.save();
      fx2.strokeStyle = `rgba(196,181,253,${(1 - r) * .8})`; fx2.lineWidth = 6 * (1 - r) + 1;
      fx2.shadowColor = "#8b5cf6"; fx2.shadowBlur = 30;
      fx2.beginPath(); fx2.arc(540, hit === 16 ? 1440 : top + 110, 120 + 900 * E.outCubic(r), 0, Math.PI * 2); fx2.stroke();
      fx2.restore();
    });
  } else icon.style.display = "none";

  // ----- texts -----
  renderTexts(t, s);

  // ----- transitions, flashes, fades -----
  drawTransitions(t);
  [[1.5, .14], [16.0, .14], [18.0, .1]].forEach(([at, amt]) => {
    const k = prog(t, at, at + 0.35);
    if (k > 0 && k < 1) { fx.fillStyle = `rgba(237,233,254,${(amt * Math.pow(1 - k, 2)).toFixed(3)})`; fx.fillRect(0, 0, W, H); }
  });
  const fadeIn = 1 - prog(t, 0, 0.15), fadeOut = E.inOutSine(prog(t, 19.3, 19.95));
  const black = Math.max(fadeIn, fadeOut);
  if (black > 0) { fx.fillStyle = `rgba(0,0,0,${black.toFixed(3)})`; fx.fillRect(0, 0, W, H); }
  // film grain
  fx.save(); fx.globalAlpha = 0.045; fx.globalCompositeOperation = "overlay";
  const gi = Math.floor(t * 30) % GRAIN.length;
  fx.fillStyle = fx.createPattern(GRAIN[gi], "repeat");
  fx.translate((t * 977) % 256, (t * 613) % 256); fx.fillRect(-256, -256, W + 512, H + 512);
  fx.restore();
}

function renderTexts(t, s) {
  const hideAll = () => [tag, head, sub, brand, cta].forEach(e => e.style.visibility = "hidden");
  if (NO_TEXT) return hideAll();
  hideAll();
  if (s === 1) {
    build(tag, T.abertura.etiqueta, 26, 940); place(tag, 700);
    build(head, T.abertura.titulo, 190, 940); place(head, 770);
    animWords(tag, t, 1.38, 2.72, { dy: 0, fromScale: 1, blur: 8, stagger: 0 });
    animWords(head, t, 1.5, 2.72, { stagger: 0.07, fromScale: 1.6, blur: 26 });
  } else if (s === 2) {
    build(tag, T.produtos.etiqueta, 26, 940); place(tag, 210);
    animWords(tag, t, 3.25, 6.0, { dy: 0, fromScale: 1, blur: 8 });
  } else if (s === 3) {
    build(tag, T.destaque.etiqueta, 26, 940); place(tag, 300);
    build(head, T.destaque.titulo, 150, 940); place(head, 360);
    build(sub, T.destaque.subtitulo, 40, 940); place(sub, 1330);
    animWords(tag, t, 7.35, 9.05, { dy: 0, fromScale: 1, blur: 8 });
    animWords(head, t, 7.5, 9.05, { stagger: 0.08, fromScale: 1.4 });
    animWords(sub, t, 8.0, 9.05, { stagger: 0.04, fromScale: 1, dy: 30, blur: 10 });
  } else if (s === 4) {
    build(tag, T.comunidade.etiqueta, 26, 940); place(tag, 190);
    build(head, T.comunidade.titulo, 150, 940); place(head, 250);
    build(sub, T.comunidade.subtitulo, 40, 940); place(sub, 1660);
    animWords(tag, t, 11.35, 14.7, { dy: 0, fromScale: 1, blur: 8 });
    animWords(head, t, 11.5, 14.7, { stagger: 0.08, fromScale: 1.4 });
    animWords(sub, t, 13.0, 14.7, { stagger: 0.04, fromScale: 1, dy: 30, blur: 10 });
  } else {
    build(tag, T.encerramento.etiqueta, 26, 940); place(tag, 330);
    build(head, T.encerramento.titulo, 170, 940); place(head, 1290);
    build(brand, T.encerramento.marca, 128, 940); place(brand, 1030);
    build(cta, T.encerramento.chamada, 28, 940); place(cta, 1190);
    animWords(tag, t, 15.3, 17.9, { dy: 0, fromScale: 1, blur: 8 });
    animWords(head, t, 16.0, 17.95, { stagger: 0.06, fromScale: 1.9, blur: 30, dur: 0.45 });
    animWords(brand, t, 18.4, 19.4, { stagger: 0.07, fromScale: 1.3, outDur: 0.5 });
    animWords(cta, t, 18.75, 19.4, { dy: 0, fromScale: 1, blur: 8, outDur: 0.5 });
  }
}

// ---------- boot ----------
async function ready() {
  await document.fonts.load("100px Anton"); await document.fonts.load("700 26px JBM"); await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
}
window.DURATION = DUR;
window.renderAt = renderAt;
window.ready = ready();

if (!params.has("render")) {
  // preview mode: fit to window and loop in real time (press space to pause)
  const stage = $("stage");
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${k})`; stage.style.marginLeft = ((innerWidth - W * k) / 2) + "px"; };
  addEventListener("resize", fit); fit();
  const fixed = params.get("t");
  window.ready.then(() => {
    if (fixed !== null) return renderAt(+fixed);
    let t0 = performance.now(), paused = false, tp = 0;
    addEventListener("keydown", e => { if (e.code === "Space") { paused = !paused; if (!paused) t0 = performance.now() - tp * 1000; } });
    const loop = now => { if (!paused) { tp = ((now - t0) / 1000) % DUR; renderAt(tp); } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
})();
</script>
</body>
</html>
