<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo Celular Grade</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
"use strict";
const W = 1080, H = 1920, DUR = 30;
const SPEED = 0.4;              // grid units per second (30 s × 0.4 = 12 units → seamless loop)
const GREEN = "#00ff00";        // chroma-key screen
const ctx = document.getElementById("c").getContext("2d");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

// ---------- perspective grid (ceiling and floor), matched to the reference ----------
// Each plane: y = horizon ± K / z (z = 1 at the screen edge). The horizon is far away, so only the
// near part shows as a band at the top and bottom that fades into black. Lines recede toward it.
const STEP = 0.15, LINE_EVERY = 2.5;   // grid spacing in z; one line passes every 2.5 s (loops in 30 s)
const PLANES = [
  { hor: 420, K: 420, S: 347, dir: -1, bandEnd: 205 },     // ceiling (band from the top down to y≈205)
  { hor: 1500, K: 420, S: 253, dir: 1, bandEnd: 1715 },    // floor (band from y≈1715 down to the bottom)
];
function grid(t) {
  const phase = (t / LINE_EVERY) % 1;
  for (const p of PLANES) {
    const edge = p.dir > 0 ? H : 0;
    const fade = y => clamp((p.dir > 0 ? y - p.bandEnd : p.bandEnd - y) / 60);
    // lines across, receding toward the horizon
    for (let n = 0; n < 40; n++) {
      const z = 1 - STEP + (n + phase) * STEP;
      const y = p.hor + p.dir * p.K / z;
      if ((p.dir > 0 && (y > H + 6 || y < p.bandEnd)) || (p.dir < 0 && (y < -6 || y > p.bandEnd))) continue;
      const near = clamp(1.6 - z);
      line(0, y, W, y, 1.8 + 2.8 * near, fade(y) * (0.6 + 0.4 * near));
    }
    // lines along, pointing to the (off-band) vanishing point
    const g = ctx.createLinearGradient(0, p.bandEnd, 0, edge);
    g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.35, "rgba(255,255,255,.7)"); g.addColorStop(1, "rgba(255,255,255,1)");
    for (let k = -8; k < 8; k++) {
      const xAt = y => W / 2 + (k + 0.5) * p.S * (Math.abs(p.hor - y) / p.K);
      glowLine(xAt(p.bandEnd), p.bandEnd, xAt(edge), edge, 3.0, g);
    }
  }
}
function line(x0, y0, x1, y1, w, a) {
  if (a <= 0.01) return;
  glowLine(x0, y0, x1, y1, w, `rgba(255,255,255,${a.toFixed(3)})`);
}
function glowLine(x0, y0, x1, y1, w, style) {
  ctx.save();
  ctx.strokeStyle = style; ctx.lineCap = "round";
  ctx.shadowColor = "rgba(255,255,255,.55)"; ctx.shadowBlur = 10;
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.restore();
}

// ---------- phone: silver frame, black bezel, green screen ----------
const PH = { x: 186, y: 240, w: 708, h: 1438, r: 100 };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function metal(x0, x1) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, "#8d8f93"); g.addColorStop(0.012, "#f4f5f7"); g.addColorStop(0.03, "#b9bbbf");
  g.addColorStop(0.5, "#d6d8db"); g.addColorStop(0.97, "#b9bbbf"); g.addColorStop(0.988, "#f4f5f7"); g.addColorStop(1, "#8d8f93");
  return g;
}
function phone() {
  const { x, y, w, h, r } = PH;
  // side buttons (left: action + volume, right: power): dark metal with a light edge
  for (const [bx, by, bw, bh] of [[x - 7, 437, 9, 45], [x - 7, 538, 9, 96], [x - 7, 671, 9, 96], [x + w - 2, 576, 9, 153]]) {
    ctx.fillStyle = "#6e7074"; rr(bx, by, bw, bh, 4); ctx.fill();
    ctx.fillStyle = "#c9cbcf"; rr(bx + (bx < x ? 0 : bw - 3), by + 2, 3, bh - 4, 2); ctx.fill();
  }
  // stainless band: dark, with a thin bright line on the outside and another on the inside
  ctx.fillStyle = "#d9dbde"; rr(x, y, w, h, r); ctx.fill();                       // outer bright line
  ctx.fillStyle = "#2a2b2d"; rr(x + 4, y + 4, w - 8, h - 8, r - 4); ctx.fill();   // dark middle
  ctx.fillStyle = metal(x + 11, x + w - 11); rr(x + 11, y + 11, w - 22, h - 22, r - 11); ctx.fill();  // inner bright line
  // black glass bezel
  ctx.fillStyle = "#030303"; rr(x + 20, y + 20, w - 40, h - 40, r - 20); ctx.fill();
  // green screen (put your video here with chroma key)
  ctx.fillStyle = GREEN; rr(x + 38, y + 38, w - 76, h - 76, r - 36); ctx.fill();
  // tiny front sensors, like the reference
  ctx.fillStyle = "#1b1b1d";
  for (const cx of [606, 616]) { ctx.beginPath(); ctx.arc(cx, y + 50, 2.6, 0, 7); ctx.fill(); }
}

function renderAt(t) {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  grid(t);
  phone();
}
window.DURATION = DUR;
window.renderAt = t => { renderAt(t); return true; };

if (!new URLSearchParams(location.search).has("render")) {
  const c = document.getElementById("c");
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); c.style.width = W * k + "px"; c.style.height = H * k + "px"; c.style.margin = "0 auto"; };
  addEventListener("resize", fit); fit();
  const t0 = performance.now();
  const loop = now => { renderAt(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
