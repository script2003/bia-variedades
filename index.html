<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>A evolução da tecnologia dentro de casa</title>
    <meta name="description" content="Exposição digital interativa em 3D: fogões, geladeiras e televisões antigos e atuais, lado a lado." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap" />
    <link rel="stylesheet" href="/src/exhibit/style.css" />
  </head>
  <body>
    <!--EXHIBIT:START-->
    <div id="app">
      <div id="stage" aria-label="Cena 3D interativa com seis eletrodomésticos"></div>

      <header class="top">
        <div class="brand">
          <p class="eyebrow">Exposição digital · 6 modelos 3D</p>
          <h1>A evolução da tecnologia dentro de casa</h1>
        </div>
        <div class="tools">
          <button type="button" class="tool" id="btn-reset" title="Voltar à visão geral inicial">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Redefinir câmera</span>
          </button>
          <button type="button" class="tool" id="btn-rotate" aria-pressed="false" title="Girar a câmera automaticamente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M17 5.5l2.5 2.5-3 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
            <span>Girar</span>
          </button>
          <button type="button" class="tool tool-icon" id="btn-help" title="Mostrar ou ocultar os comandos" aria-controls="hint">
            <span aria-hidden="true">?</span><span class="sr">Comandos</span>
          </button>
        </div>
      </header>

      <nav class="areas" id="nav" aria-label="Áreas da exposição">
        <button type="button" data-view="overview">Visão geral</button>
        <button type="button" data-area="fogoes"><span class="n">1</span>Fogões</button>
        <button type="button" data-area="geladeiras"><span class="n">2</span>Geladeiras</button>
        <button type="button" data-area="televisoes"><span class="n">3</span>Televisões</button>
      </nav>

      <p class="hint" id="hint">Arraste para girar · role ou faça pinça para aproximar · botão direito ou dois dedos para mover · toque em um aparelho para selecioná-lo</p>

      <aside class="panel" id="panel" aria-label="Informações">
        <button type="button" class="sheet-handle" id="sheet-toggle" aria-expanded="true" aria-controls="panel-body">
          <span class="grip" aria-hidden="true"></span><span class="sr">Mostrar ou ocultar o painel</span>
        </button>
        <div class="panel-body" id="panel-body"></div>
      </aside>

      <div class="loader" id="loader" role="status"><span>Montando a exposição…</span></div>
    </div>
    <!--EXHIBIT:END-->
    <script type="module" src="/src/exhibit/main.js"></script>
  </body>
</html>
